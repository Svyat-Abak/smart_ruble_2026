server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          # Таймауты обращения к внутренним сервисам
          httpclient:
            connect-timeout: 2000      # мс на установку соединения
            response-timeout: 10s      # максимум ждём ответа
          # Фильтры, применяемые ко ВСЕМ маршрутам
          default-filters:
            # если и шлюз, и сервис добавят CORS-заголовки — оставить одну копию
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
          routes:
            # ---------- auth-service ----------
            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/v1/auth/**, /api/v1/users/**, /api/v1/admin/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: auth-service
                    fallbackUri: forward:/fallback/auth-service

            # ---------- billing-service ----------
            - id: billing-service
              uri: ${BILLING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/v1/billing/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: billing-service
                    fallbackUri: forward:/fallback/billing-service

            # ---------- notification-service ----------
            - id: notification-service
              uri: ${NOTIFICATION_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/v1/notifications/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: notification-service
                    fallbackUri: forward:/fallback/notification-service

            # abs-service и integration-service НЕ публикуются наружу:
            # их вызывает только billing-service внутри сети.

            # ---------- OpenAPI-описания сервисов для общего Swagger UI ----------
            # /auth-service/v3/api-docs  ->  http://auth-service/v3/api-docs
            - id: auth-service-openapi
              uri: ${AUTH_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/auth-service/v3/api-docs
              filters:
                - RewritePath=/auth-service/(?<path>.*), /$\{path}
            - id: billing-service-openapi
              uri: ${BILLING_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/billing-service/v3/api-docs
              filters:
                - RewritePath=/billing-service/(?<path>.*), /$\{path}

# Circuit breaker (Resilience4j)
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20                 # смотрим на последние 20 запросов
        minimum-number-of-calls: 10             # раньше 10 вызовов не оцениваем
        failure-rate-threshold: 50              # >= 50% ошибок -> цепь "размыкается"
        wait-duration-in-open-state: 15s        # столько не трогаем упавший сервис
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    configs:
      default:
        timeout-duration: 10s                   # по умолчанию 1s — для логина с bcrypt мало

app:
  jwt:
    # ТОТ ЖЕ секрет и issuer, что у auth-service
    secret: ${JWT_SECRET:c21hcnRydWJsZS1hdXRoLXNlcnZpY2UtZGV2LXNlY3JldC1rZXktY2hhbmdlLW1lLWluLXByb2Q=}
    issuer: ${JWT_ISSUER:smartruble-auth-service}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    capacity: ${RATE_LIMIT_CAPACITY:100}                 # размер "ведра" — сколько запросов можно сделать залпом
    refill-per-second: ${RATE_LIMIT_REFILL_PER_SECOND:20} # скорость пополнения
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: auth-service
        url: /auth-service/v3/api-docs
      - name: billing-service
        url: /billing-service/v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    gateway:
      access: read-only
    health:
      show-details: when-authorized   # детали (в т.ч. состояние circuit breaker'ов) — только админу
      roles: ROLE_ADMIN
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    com.smartruble.apigateway: INFO
