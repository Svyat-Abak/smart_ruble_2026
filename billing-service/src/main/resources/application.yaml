server:
  port: 8082

spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        max.block.ms: 3000
  application:
    name: billing-service
  datasource:
    url: jdbc:postgresql://localhost:5432/billing_db
    username: billing
    password: billing
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # схему создаёт только Liquibase, Hibernate лишь сверяет
    properties:
      hibernate:
        jdbc.time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.xml

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,modulith

app:
  bank:
    url: ${BANK_URL:http://localhost:8083}
    key: ${BANK_KEY:local-demo-bank-key}
  events:
    enabled: ${EVENTS_ENABLED:false}
