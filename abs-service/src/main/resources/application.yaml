server:
  port: 8083
spring:
  application:
    name: abs-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/abs_service}
    username: ${DB_USERNAME:demo}
    password: ${DB_PASSWORD:demo}
  sql:
    init:
      mode: always
management:
  endpoints:
    web:
      exposure:
        include: health,info
